<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2F1F"/>
      <stop offset="50%" stop-color="#6F4E37"/>
      <stop offset="100%" stop-color="#A47551"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="180" fill="url(#footBg)"/>

  <!-- subtle top wave -->
  <path d="M0,20 Q250,0 500,18 T1000,15 L1000,0 L0,0 Z" fill="#ffffff" opacity="0.08"/>

  <!-- drifting dots for texture -->
  <circle cx="80" cy="140" r="1.6" fill="#E8D5C4" opacity="0.4">
    <animate attributeName="cx" values="80;920;80" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="40" r="1.4" fill="#C9A27E" opacity="0.4">
    <animate attributeName="cx" values="900;60;900" dur="24s" repeatCount="indefinite"/>
  </circle>

  <!-- message -->
  <text x="500" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F5EDE4" text-anchor="middle">
    Let's build something worth talking about
  </text>
  <text x="500" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#E8D5C4" text-anchor="middle">
    Always open to a conversation about AI, data, or your next idea
  </text>

  <!-- underline flourish -->
  <rect x="400" y="112" width="200" height="2" fill="#E8D5C4" opacity="0.6"/>

  <!-- email icon -->
  <g transform="translate(330,130)">
    <rect x="0" y="0" width="22" height="16" rx="2" fill="none" stroke="#F5EDE4" stroke-width="1.4"/>
    <path d="M1,1 L11,10 L21,1" fill="none" stroke="#F5EDE4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="13" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#F5EDE4">prabhaudhaya897@gmail.com</text>
  </g>

  <!-- linkedin icon -->
  <g transform="translate(660,130)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="none" stroke="#F5EDE4" stroke-width="1.4"/>
    <circle cx="5" cy="5.5" r="1.3" fill="#F5EDE4"/>
    <rect x="4" y="8" width="2.4" height="7" fill="#F5EDE4"/>
    <path d="M9,15 V8 M9,10 C9,8.5 13,8.5 13,10.5 V15" fill="none" stroke="#F5EDE4" stroke-width="1.4" stroke-linecap="round"/>
    <text x="28" y="13" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#F5EDE4">linkedin.com/in/prabhavathi-udhayakumar</text>
  </g>
</svg>
